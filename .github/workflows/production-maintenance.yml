name: Production maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate maintenance configuration
        id: configuration
        env:
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          test -n "${MAINTENANCE_SECRET}" || {
            echo "::error::The MAINTENANCE_SECRET repository secret is not configured."
            exit 1
          }
          case "${PRODUCTION_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::The PRODUCTION_BASE_URL repository variable must be an HTTPS origin."
              exit 1
              ;;
          esac

      - name: Enforce private-data retention
        env:
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          response_file="${RUNNER_TEMP}/privacy-retention.json"
          status="$(curl --silent --show-error \
            --request POST \
            --max-time 70 \
            --retry 2 \
            --retry-max-time 180 \
            --retry-all-errors \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${MAINTENANCE_SECRET}" \
            "${PRODUCTION_BASE_URL%/}/api/maintenance/privacy-retention")"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Privacy retention returned HTTP ${status}."
            exit 1
          fi
          echo "Privacy retention completed successfully."

      - name: Verify recovery health and snapshot lifecycle
        if: ${{ always() && steps.configuration.outcome == 'success' }}
        env:
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          response_file="${RUNNER_TEMP}/recovery.json"
          status="$(curl --silent --show-error \
            --request POST \
            --max-time 70 \
            --retry 2 \
            --retry-max-time 180 \
            --retry-all-errors \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${MAINTENANCE_SECRET}" \
            "${PRODUCTION_BASE_URL%/}/api/maintenance/recovery")"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Recovery maintenance returned HTTP ${status}."
            exit 1
          fi
          echo "Recovery maintenance completed successfully."

      - name: Drain durable progression jobs
        if: ${{ always() && steps.configuration.outcome == 'success' }}
        env:
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          response_file="${RUNNER_TEMP}/progression.json"
          status="$(curl --silent --show-error \
            --request POST \
            --max-time 70 \
            --retry 2 \
            --retry-max-time 180 \
            --retry-all-errors \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${MAINTENANCE_SECRET}" \
            "${PRODUCTION_BASE_URL%/}/api/maintenance/progression")"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Progression maintenance returned HTTP ${status}."
            exit 1
          fi
          echo "Progression maintenance completed successfully."
