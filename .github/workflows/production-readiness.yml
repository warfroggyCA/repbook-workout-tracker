name: Production readiness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: workout_tracker_test
          POSTGRES_USER: workout_tracker_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workout_tracker_test -d workout_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://workout_tracker_test:local-test-only@127.0.0.1:5432/workout_tracker_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run true parallel PostgreSQL integration tests
        run: npm run test:integration:postgres

  core:
    runs-on: ubuntu-latest
    container:
      # Playwright 1.61.1 Noble image, pinned to its reviewed multi-architecture manifest.
      image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay migrations from zero
        run: npm run db:verify

      - name: Rehearse upgrade from the current production schema
        run: npm run db:verify-production-upgrade

      - name: Reject skipped or focused tests
        run: npm run test:selection

      - name: Validate current documentation links
        run: npm run docs:check

      - name: Validate protected browser group coverage
        run: npm run ci:browser-groups:check

      - name: Run isolated production performance budgets
        run: npm run test:performance:isolated

      - name: Run unit, database, race, failure, and coverage checks
        run: npm run test:coverage:ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Recheck generated route types
        run: npm run typecheck

      - name: Review production and development dependencies
        run: npm run audit:check

      - name: Verify exact Playwright browser image
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          test "${version}" = "1.61.1"
          node -e 'const fs = require("fs"); const { chromium, firefox, webkit } = require("playwright"); for (const [name, browser] of Object.entries({ chromium, firefox, webkit })) { const executable = browser.executablePath(); fs.accessSync(executable, fs.constants.X_OK); console.log(`${name}: ${executable}`); }'
          npx playwright install --list

  browser:
    name: browser / ${{ matrix.group }}
    runs-on: ubuntu-latest
    container:
      # Keep every browser group on the same exact image verified by core.
      image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - baseline-history
          - program
          - workout-remediation
          - v2-recording
          - v2-execution
          - v2-history-coaching
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run protected browser group
        run: node scripts/run-production-browser-group.mjs "${{ matrix.group }}"

  verify:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - postgres-integration
      - core
      - browser
    steps:
      - name: Require every protected job
        env:
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          failed=0
          for result in \
            "PostgreSQL:${POSTGRES_RESULT}" \
            "automated/static/build core:${CORE_RESULT}" \
            "complete browser matrix:${BROWSER_RESULT}"
          do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "::error::${name} finished with ${outcome}."
              failed=1
            fi
          done
          exit "${failed}"
