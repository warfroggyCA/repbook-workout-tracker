name: Replacement input diagnosis
on:
  push:
    branches: [codex/replacement-input-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --config=playwright.v2-gauntlet-a.config.ts tests/e2e/replacement-mobile-keyboard.spec.ts --project=narrow-mobile-webkit --repeat-each=5
